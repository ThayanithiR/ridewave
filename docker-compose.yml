version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ridewave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ridewave
      POSTGRES_PASSWORD: ridewave_password
      POSTGRES_DB: ridewave_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridewave -d ridewave_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ridewave-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ridewave-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ridewave:ridewave_password@postgres:5432/ridewave_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: production-super-secret-key-change-me
      AI_ENABLED: "false"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ridewave-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
